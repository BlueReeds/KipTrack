<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>45e Parallèle Habitat, poêles à bois et à granulés</title>
<meta name="description" content="Poêles à bois et à granulés : conseil, vente, pose ou accompagnement. Trouvez votre poêle et demandez votre devis.">
<meta property="og:title" content="45e Parallèle Habitat, poêles à bois et à granulés">
<meta property="og:description" content="Le feu comme source de confort.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F2F4F5;--surface:#FFFFFF;--ink:#0F2530;--muted:#51616B;--line:#D9DFE3;--soft:#E4E9EC;--on-ink:#FFFFFF;
  --chaud:#E85D2A;--froid:#2F8FCB;--humide:#1FA79A;--ok:#147A6E;--err:#B3261E;
  --accent:var(--chaud);--accent-t:#B4411A;--on-accent:#0F2530;
  --r:8px;--r-sm:4px;
  --display:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1A22;--surface:#11262F;--ink:#F2F4F5;--muted:#9FADB5;--line:#22383F;--soft:#182F39;--on-ink:#0F2530;
  --froid:#4FA6DD;--humide:#2DBDAE;--ok:#3CC5B5;--err:#FF8A80;--accent-t:#F38D62}}
:root[data-theme="dark"]{
  --bg:#0A1A22;--surface:#11262F;--ink:#F2F4F5;--muted:#9FADB5;--line:#22383F;--soft:#182F39;--on-ink:#0F2530;
  --froid:#4FA6DD;--humide:#2DBDAE;--ok:#3CC5B5;--err:#FF8A80;--accent-t:#F38D62}
[data-u="chaud"]{--accent:var(--chaud)}[data-u="froid"]{--accent:var(--froid)}[data-u="humide"]{--accent:var(--humide)}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:clamp(2.5rem,9.5vw,6.25rem);letter-spacing:-.04em;line-height:.94}
h2{font-size:clamp(1.9rem,5.6vw,3.5rem)}
h3{font-size:1.3rem;line-height:1.15;letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--on-ink);padding:.8rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
.wrap{width:min(1240px,100% - 2.5rem);margin-inline:auto}
.lead{font-size:clamp(1.1rem,2.4vw,1.35rem);color:var(--muted);max-width:38em}
.muted{color:var(--muted)}.small{font-size:.9rem}
.sec{padding-block:clamp(3.5rem,9vw,7rem)}
.sec-h{display:grid;gap:1rem;margin-bottom:clamp(1.75rem,4vw,3rem)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.7rem 1.4rem;border-radius:var(--r-sm);border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s,opacity .15s;text-align:center}
.btn:hover{opacity:.86}.btn:active{transform:scale(.98)}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-light{background:#fff;border-color:#fff;color:#0F2530}
.btn-glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7);color:#fff;backdrop-filter:blur(6px)}
.btn-sm{min-height:40px;padding:.4rem .9rem;font-size:.92rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.75rem}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}

/* en-tête */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:1rem;min-height:66px}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.dots{display:flex;gap:3px}.dots i{width:11px;height:11px;border-radius:50%}
.dots i:nth-child(1){background:var(--chaud)}.dots i:nth-child(2){background:var(--froid)}.dots i:nth-child(3){background:var(--humide)}
.nav{display:none;gap:1.6rem;margin-right:auto}
.nav a{text-decoration:none;font-weight:500;padding:.5rem 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current]{border-color:var(--accent)}
.hdr .only-d{display:none}
.burger{width:46px;height:46px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:transparent;cursor:pointer;display:grid;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:2px;background:var(--ink);content:"";position:relative}
.burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}
.menu{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.25rem 2rem;display:flex;flex-direction:column;gap:.25rem;overflow:auto}
.menu[hidden]{display:none}
.menu a.big{font-family:var(--display);font-size:2.3rem;font-weight:700;letter-spacing:-.03em;text-decoration:none;padding:.35rem 0;display:flex;align-items:center;gap:.7rem}
.menu a.big i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.menu .btn-row{margin-top:auto;padding-top:1.5rem}.menu .btn{flex:1 1 100%}
@media(min-width:960px){.nav{display:flex}.logo{margin-right:2.5rem}.hdr .only-d{display:inline-flex}.burger{display:none}}

/* hero */
.hero{padding-top:clamp(2rem,6vw,4.5rem)}
.hero-t{display:grid;gap:1.4rem;margin-bottom:clamp(1.75rem,4vw,3rem)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:clamp(300px,52vh,560px)}
.tri a{position:relative;overflow:hidden;border-radius:var(--r);text-decoration:none;color:#fff;display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.tri a:nth-child(2){animation-delay:.12s}.tri a:nth-child(3){animation-delay:.24s}
.tri svg{position:absolute;inset:0;width:100%;height:100%}
.tri a::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0) 55%)}
.tri b{position:absolute;left:.8rem;bottom:.8rem;z-index:1;font-family:var(--display);font-size:clamp(1.15rem,3.6vw,2.4rem);letter-spacing:-.03em;line-height:1}
.tri small{display:none;font:500 .95rem var(--body);letter-spacing:0;margin-top:.35rem;opacity:.9}
@media(min-width:760px){.tri{gap:10px;display:flex}.tri a{flex:1;transition:flex .5s cubic-bezier(.2,.7,.2,1)}.tri a:hover,.tri a:focus-visible{flex:1.7}.tri b{left:1.4rem;bottom:1.3rem}.tri small{display:block}}
@keyframes rise{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.94,1.06)}70%{transform:scale(1.04,.96)}}

/* bandes immersives */
.band{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#111}
.band-s{min-height:min(62vh,560px)}
.band>svg{position:absolute;inset:0;width:100%;height:100%}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.12) 60%,rgba(0,0,0,0))}
.band-c{position:relative;z-index:1;padding-block:clamp(2rem,6vw,4rem);display:grid;gap:1rem}
.band-c h1,.band-c h2{font-size:clamp(3rem,13vw,8.5rem);letter-spacing:-.05em;line-height:.88}
.band-c .sub{font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,3vw,1.7rem);letter-spacing:-.02em}
.band-c p{max-width:32em;font-size:1.1rem;color:rgba(255,255,255,.88)}
.band-c .btn-row{margin-top:.6rem}
.crumbs{font-size:.9rem;color:var(--muted);padding-block:1.1rem .2rem;display:flex;flex-wrap:wrap;gap:.4rem}
.crumbs a{text-underline-offset:3px}

/* grilles & cartes */
.grid{display:grid;gap:1.1rem}
@media(min-width:620px){.g2,.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;border:1px solid var(--line)}
.card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--soft)}
.card-img svg,.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
a.card:hover .card-img svg,a.card:hover .card-img img{transform:scale(1.03)}
.card-b{padding:1.1rem 1.15rem 1.3rem;display:grid;gap:.35rem}
.badges{position:absolute;left:.7rem;top:.7rem;display:flex;gap:.35rem;flex-wrap:wrap}
.badge{background:#fff;color:#0F2530;border-radius:99px;padding:.2rem .65rem;font-size:.8rem;font-weight:600}
.badge-p{background:var(--accent);color:var(--on-accent)}
.price{margin-top:.3rem}.price b{font-family:var(--display);font-size:1.3rem;letter-spacing:-.02em}
.price s{color:var(--muted);margin-right:.35rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;display:grid;gap:.6rem;align-content:start;text-decoration:none}
a.tile:hover{border-color:var(--accent)}
.tile .bar{width:34px;height:4px;border-radius:2px;background:var(--accent)}

/* formules */
.formules{display:grid;gap:1rem;align-items:stretch}
@media(min-width:900px){.formules{grid-template-columns:1fr 1.15fr 1fr}}
.fo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;display:flex;flex-direction:column;gap:.9rem}
.fo h3{font-size:1.55rem}
.fo ul{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
.fo li{padding-left:1.5rem;position:relative}
.fo li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.fo li.no{color:var(--muted)}.fo li.no::before{border:0;width:10px;height:2px;top:.75em;background:currentColor;transform:none}
.fo .btn{margin-top:auto}
.fo-top{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.fo-top .muted{color:inherit;opacity:.75}
.fo-top .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.fo-tag{align-self:flex-start;background:var(--bg);color:var(--ink);border-radius:99px;padding:.15rem .7rem;font-size:.82rem;font-weight:600}
.fo[aria-pressed="true"],.fo.sel{outline:3px solid var(--accent);outline-offset:2px}

/* catalogue & filtres */
.cat-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.cat-l{display:grid;gap:1.5rem}
@media(min-width:980px){.cat-l{grid-template-columns:270px 1fr;align-items:start}.filters-m{display:none}.fil-side{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;padding-right:.5rem}}
@media(max-width:979px){.fil-side{display:none}}
.fg{border:0;padding:0;margin:0 0 1.25rem}
.fg legend{font-weight:600;margin-bottom:.5rem;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{min-height:44px;padding:.4rem .95rem;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
dialog{border:0;border-radius:var(--r);background:var(--bg);color:var(--ink);padding:0;width:min(680px,100% - 1.5rem);max-height:calc(100% - 2rem)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.dlg-b{padding:1.25rem}
.dlg-f{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:.9rem 1.25rem;display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
dialog.sheet{margin:auto auto 0;width:100%;max-width:100%;border-radius:var(--r) var(--r) 0 0;max-height:88%}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:1.2rem;line-height:1}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:2.5rem 1.5rem;text-align:center;display:grid;gap:.9rem;justify-items:center}

/* page produit */
.pp{display:grid;gap:2rem;padding-block:1rem 3rem}
@media(min-width:940px){.pp{grid-template-columns:1.25fr 1fr;gap:3.5rem;align-items:start}.pp-info{position:sticky;top:96px}}
.gal-main{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--soft);position:relative}
.gal-main svg,.gal-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:.5rem;margin-top:.6rem;overflow-x:auto}
.thumbs button{width:84px;aspect-ratio:4/3;flex:none;border-radius:var(--r-sm);overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--soft)}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs svg,.thumbs img{width:100%;height:100%;object-fit:cover}
.pp-info{display:grid;gap:1.1rem}
.pp-info h1{font-size:clamp(2.2rem,6vw,3.6rem)}
.pp-price b{font-family:var(--display);font-size:2.2rem;letter-spacing:-.03em}
.pp-price s{color:var(--muted);font-size:1.1rem;margin-right:.5rem}
.save{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:.15rem .7rem;font-weight:600;font-size:.9rem;margin-left:.4rem;vertical-align:middle}
.dispo{display:inline-flex;align-items:center;gap:.5rem;font-weight:500}
.dispo::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dispo.wait::before{background:#C58A1A}
.specs{width:100%;border-collapse:collapse}
.specs th,.specs td{text-align:left;padding:.65rem 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs th{font-weight:500;color:var(--muted);width:45%;padding-right:1rem}
.taglist{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:0}
.taglist li{border:1px solid var(--line);border-radius:99px;padding:.25rem .8rem;font-size:.93rem;background:var(--surface)}
.stickbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:.6rem 1.25rem calc(.6rem + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:1rem}
.stickbar b{font-family:var(--display);font-size:1.15rem}
@media(min-width:940px){.stickbar{display:none}}
.has-stick{padding-bottom:84px}

/* formulaires */
.form{display:grid;gap:1.1rem;max-width:720px}
.f2{display:grid;gap:1.1rem}@media(min-width:620px){.f2{grid-template-columns:1fr 1fr}}
.f{display:grid;gap:.35rem}
.f label,.f .lab{font-weight:600}
.opt{font-weight:400;color:var(--muted);font-size:.9rem}
.f input:not([type=checkbox]):not([type=file]),.f select,.f textarea{width:100%;min-height:50px;padding:.65rem .85rem;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface)}
.f textarea{min-height:120px;resize:vertical}
.f input[type=file]{padding:.6rem 0}
.f [aria-invalid="true"]{border-color:var(--err)}
.err{color:var(--err);font-size:.93rem;font-weight:500}
.check{display:flex;gap:.6rem;align-items:center;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.15rem;display:grid;gap:.3rem}
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1.5rem,5vw,3rem);display:grid;gap:1rem;max-width:720px}

/* configurateur */
.cfg{max-width:860px}
.prog{display:flex;gap:6px;margin:1rem 0 2rem}.prog i{height:5px;flex:1;border-radius:3px;background:var(--line)}.prog i.on{background:var(--accent)}
.choices{display:grid;gap:.8rem}@media(min-width:700px){.choices{grid-template-columns:repeat(3,1fr)}.choices.c2{grid-template-columns:repeat(2,1fr)}}
.choice{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:1.4rem;text-align:left;cursor:pointer;display:grid;gap:.4rem;min-height:110px;align-content:center}
.choice:hover{border-color:var(--ink)}
.choice .em{font-size:2rem;line-height:1}
.choice b{font-family:var(--display);font-size:1.4rem;letter-spacing:-.02em}
.q{margin-bottom:1.5rem}.q .lab{font-weight:600;margin-bottom:.55rem;display:block}

/* réalisations, avis, engagements */
.ba{position:absolute;right:.7rem;bottom:.7rem;display:flex;background:#fff;border-radius:99px;padding:3px}
.ba button{border:0;background:transparent;color:#0F2530;border-radius:99px;padding:.3rem .8rem;font-weight:600;font-size:.85rem;cursor:pointer;min-height:36px}
.ba button[aria-pressed="true"]{background:#0F2530;color:#fff}
.avis{display:grid;gap:.8rem;padding:1.6rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.avis blockquote{margin:0;font-family:var(--display);font-size:1.25rem;line-height:1.3;letter-spacing:-.01em}
.stars{letter-spacing:2px;color:var(--accent)}
.eng{display:grid;gap:0}
.eng>div{display:grid;gap:.4rem;padding:1.5rem 0;border-top:1px solid var(--line)}
@media(min-width:800px){.eng>div{grid-template-columns:1fr 1.4fr;gap:2rem;align-items:baseline}}
.final{background:var(--ink);color:var(--on-ink);text-align:left}
.final h2{font-size:clamp(3.2rem,14vw,9rem);letter-spacing:-.05em;line-height:.86}
.final .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.final .btn-ghost{background:transparent;color:var(--on-ink);border-color:var(--on-ink)}
.final-in{display:grid;gap:1.6rem}
.note{border-left:4px solid var(--accent);background:var(--surface);padding:1.1rem 1.25rem;border-radius:0 var(--r-sm) var(--r-sm) 0}
.two{display:grid;gap:2rem}@media(min-width:900px){.two{grid-template-columns:1fr 1fr;gap:4rem;align-items:start}}
.plain{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.plain li{padding-left:1.2rem;position:relative}.plain li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* pied de page */
.ftr{border-top:1px solid var(--line);padding-block:3rem 2rem;margin-top:0}
.ftr-g{display:grid;gap:2rem;grid-template-columns:1fr 1fr}
@media(min-width:900px){.ftr-g{grid-template-columns:1.6fr repeat(4,1fr)}}
.ftr-g>div:first-child{grid-column:1/-1}@media(min-width:900px){.ftr-g>div:first-child{grid-column:auto}}
.ftr h3{font-size:1rem;font-family:var(--body);letter-spacing:0;margin-bottom:.7rem}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:.15rem}
.ftr li a{text-decoration:none;color:var(--muted);display:inline-block;padding:.35rem 0}.ftr li a:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:.8rem 1.2rem;border-radius:var(--r-sm);z-index:90;max-width:calc(100% - 2rem);font-weight:500}
.toast:empty{display:none}

/* back-office */
.adm{padding-block:1.5rem 4rem}
.adm-tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:1.5rem;border-bottom:1px solid var(--line)}

  guides:[
    {id:'bois-ou-granules',titre:'Bois ou granulés : comment choisir ?',categorie:'Choisir',visuel:'choisir',resume:'Deux façons de se chauffer au bois, deux quotidiens différents.',corps:['Les deux brûlent du bois. Ce qui change, c’est votre quotidien : le temps que vous voulez y consacrer, et ce que vous attendez de la flamme.','## Le poêle à bois','Vous chargez les bûches, vous réglez l’arrivée d’air, vous regardez le feu. Il fonctionne sans électricité et le combustible reste le moins cher si vous avez de la place pour le stocker au sec.','## Le poêle à granulés','Vous remplissez le réservoir, vous choisissez une température, il s’allume et s’arrête seul. Il demande une prise électrique, un sac de granulés tous les un à deux jours en hiver et un entretien régulier.','## Les questions à se poser','Êtes-vous souvent absent en journée ? Avez-vous un abri pour stocker du bois ? Voulez-vous une chaleur d’appoint ou votre chauffage principal ? Vos réponses orientent le choix plus sûrement que la fiche technique.','## Et si vous hésitez encore','Venez voir les deux allumés au magasin, ou répondez aux quelques questions de « Trouver mon poêle ».'],ordre:1,publie:true},
    {id:'quelle-puissance',titre:'Quelle puissance pour votre pièce ?',categorie:'Dimensionner',visuel:'puissance',resume:'Trop puissant, un poêle chauffe mal. Voici comment viser juste.',corps:['On croit souvent bien faire en prenant plus puissant. C’est l’erreur la plus courante : un poêle surdimensionné tourne au ralenti, encrasse sa vitre et son conduit, et consomme plus.','## Un ordre de grandeur','Dans une maison correctement isolée, on compte souvent autour de 1 kW pour 10 m². C’est un point de départ, pas un calcul : une maison ancienne en demande davantage, une maison récente beaucoup moins.','## Ce qui change tout','L’isolation, la hauteur sous plafond, la région, l’ouverture de la pièce sur le reste de la maison, et le rôle du poêle : appoint ou chauffage principal.','## Notre façon de faire','Nous dimensionnons le poêle avec vous, sur plan ou lors d’une visite, avant tout devis. C’est inclus dans le conseil, quelle que soit la formule.'],ordre:2,publie:true},
    {id:'bien-choisir-son-bois',titre:'Bien choisir et stocker son bois',categorie:'Utiliser',visuel:'bois',resume:'Un bois sec fait un meilleur feu, plus propre et plus chaud.',corps:['Le meilleur poêle du monde brûle mal un bois humide. La qualité du combustible compte autant que celle de l’appareil.','## Un bois sec avant tout','Visez un taux d’humidité inférieur à 20 %. Un bois fraîchement coupé a besoin d’environ deux ans de séchage sous abri ventilé. Un humidimètre coûte quelques dizaines d’euros et lève le doute.','## Les essences','Les feuillus durs comme le chêne, le hêtre ou le charme brûlent longtemps. Les bois tendres s’enflamment vite et servent bien à l’allumage.','## Le stockage','À l’abri de la pluie, surélevé du sol, avec de l’air qui circule. Rentrez quelques jours de bûches à l’avance près du poêle.','## Les granulés','Stockez les sacs au sec et choisissez des granulés certifiés : ils laissent moins de cendres et protègent le mécanisme d’alimentation.'],ordre:3,publie:true},

  let cMin=0,cMax=0;

  if(s.depose==='oui'){pMin+=500;pMax+=1250}

  return{stove:[stoveMin,stoveMax],conduit:[cMin,cMax],env:[eMin,eMax],pose:[pMin,pMax],total:[tMin,tMax],aide:[aMin,aMax],net:[Math.max(tMin-aMax,0),Math.max(tMax-aMin,0)],aideEligible:ok};
}

  return `<svg viewBox="0 0 320 130" role="img" aria-label="Demandes par semaine sur les 8 dernières semaines : ${c.join(', ')}" style="width:100%">${c.map((v,i)=>{const h=v/mx*86;return `<rect x="${i*40+6}" y="${100-h}" width="28" height="${Math.max(h,2)}" rx="4" fill="currentColor" opacity="${i===n-1?1:.35}"/><text x="${i*40+20}" y="${94-h}" text-anchor="middle" font-size="11" fill="currentColor">${v||''}</text><text x="${i*40+20}" y="118" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">${i===n-1?'cette sem.':'S−'+(n-1-i)}</text>`}).join('')}</svg>`};
const barRows=(rows,u)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="barrow"><span class="small">${esc(r[0])}</span><i style="width:${r[1]/mx*100}%"></i><b>${r[1]}</b></div>`).join('')||'<p class="muted small">Pas encore de données.</p>'};

  pfil(b){ADM.pcat=b.dataset.v;render(false)},lfil(b){ADM.lstat=b.dataset.v;render(false)},
  leadopen(b){ADM.lead=b.dataset.id||null;go('/admin/demandes')},
  leadnote(b){const t=$('#lnote').value.trim();if(!t){$('#lnote').focus();return}$('#lnote').value='';leadUpd(b.dataset.id,l=>(l.notes=l.notes||[]).push({d:new Date().toISOString(),t}),'Note ajoutée')},
  async contentsave(){const o={};$$('#contentform [name]').forEach(e=>o[e.name]=e.value.trim());const prev=contentOver;contentOver=o;if(db){try{await db.doc('site/content').set(o)}catch(e){contentOver=prev;toast('Enregistrement impossible.');return}}$$('#contentform [name]').forEach(e=>e.value='');toast('Textes enregistrés.');render(false)}
};
const CHG={
  leadstat(e){leadUpd(e.dataset.id,l=>l.statut=e.value,'Statut : '+e.value)},
  leadmont(e){leadUpd(e.dataset.id,l=>l.montant=+e.value||0,'Montant du devis : '+eur(+e.value||0))},
  async prix(e){const p=clone(get('products',e.dataset.id));p[e.dataset.k]=Math.max(0,+e.value||0);if(await save('products',p))toast('Prix mis à jour : '+eur(price(p).fin)+'.');e.blur();render(false)}
};
Object.assign(ACT,SIMACT,{
  async logout(){await sb.auth.signOut();await setSession(null);over.leads={};go('/')},
  async reload(){toast(await loadAll()?'Demandes à jour.':'Actualisation impossible. Vérifiez votre connexion.');render(false)},
  heroplay(){const v=$('.hero-b video');if(!v)return;if(v.paused){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause()},
  mediadel(b){const k=b.dataset.k,vid=k==='hero-video';ask(k==='logo'?'Retirer le logo ?':vid?'Retirer la vidéo et revenir à la photo ?':'Retirer cette photo et revenir à l’illustration ?',async()=>{const old=(over.media[k]||{}).asset;
    if(await removeDoc('media',k)){if(old&&assets){try{await assets.delete(old)}catch(e){}}toast(vid?'Vidéo retirée.':'Photo retirée.');render(false)}})}});
CHG.video=async e=>{const f=e.files[0],k='hero-video';if(!f)return;
  if(!/^video\/(mp4|webm)$/.test(f.type)){toast('Format non accepté. Utilisez une vidéo MP4 ou WebM (un fichier .mov est à convertir en MP4).');e.value='';return}
  if(f.size>45*1024*1024){toast('La vidéo pèse '+Math.round(f.size/1048576)+' Mo. La limite est de 45 Mo : raccourcissez-la ou réduisez sa qualité.');e.value='';return}
  const old=(over.media[k]||{}).asset;
  if(assets){toast('Envoi de la vidéo…');try{const r=await assets.upload(f);if(await save('media',{id:k,asset:r.id,src:r.url,ordre:0})){if(old&&old!==r.id){try{await assets.delete(old)}catch(x){}}toast('Vidéo mise en ligne.')}}
    catch(err){const c=/exceed|too large|413/i.test((err&&err.message)||'')?'too_large':err&&err.code;toast(c==='too_large'?'La vidéo est trop lourde (45 Mo au plus).':c==='unsupported_type'?'Ce fichier n’est pas reconnu comme une vidéo MP4 ou WebM.':c==='quota_or_state'?'L’espace de stockage de la page est plein. Retirez un fichier, puis réessayez.':'L’envoi a échoué. Réessayez dans un instant.')}}
  else if(db){toast('Connectez-vous au back-office pour envoyer une vidéo.')}
  else{await save('media',{id:k,src:URL.createObjectURL(f),ordre:0});toast('Vidéo affichée pour cet essai. Elle ne sera enregistrée que sur la version publiée.')}
  document.activeElement&&document.activeElement.blur();render(false)};
CHG.media=async e=>{const f=e.files[0],k=e.dataset.k;if(!f)return;toast('Préparation de la photo…');let d=k==='logo'?await logoData(f):assets?await shrink(f,2000,.82):await shrinkTo(f);
  if(!d){toast('Ce fichier ne peut pas être utilisé. Essayez une image JPG ou PNG.');return}
  const old=(over.media[k]||{}).asset;let asset='';
  if(assets&&k!=='logo'){try{const r=await hostImg(d);d=r.url;asset=r.id}catch(x){toast('L’envoi de la photo a échoué. Réessayez dans un instant.');return}}
  if(old&&assets){try{await assets.delete(old)}catch(x){}}
  if(await save('media',{id:k,src:d,asset,ordre:0}))toast(k==='logo'?'Logo mis en ligne.':'Photo mise en ligne.');document.activeElement&&document.activeElement.blur();render(false)};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(b){if(b.tagName==='A')e.preventDefault();ACT[b.dataset.act](b,e);return}
  const a=e.target.closest('[data-go]');if(a){e.preventDefault();const m=$('#menu');if(m)m.hidden=true;go(a.dataset.go,a.dataset.scroll?{scroll:a.dataset.scroll}:undefined)}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.chg)return CHG[t.dataset.chg](t);
  if(t.id==='edphotos'){readEditor();ED.doc.photos=ED.doc.photos||[];for(const f of [...t.files]){if(ED.doc.photos.length>=2)break;let d=await shrink(f,assets?1400:760,assets?.8:.62);if(d&&assets){try{d=(await hostImg(d)).url}catch(x){d=null;toast('L’envoi de la photo a échoué. Réessayez dans un instant.')}}if(d)ED.doc.photos.push(d)}redrawEditor();return}
  if(t.name==='cat'&&t.closest('#edform'))redrawEditor();
});
document.addEventListener('input',e=>{if(e.target.closest('#edform')&&/^(prix|remisePct|remiseEur)$/.test(e.target.name))edPrice()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.dataset.lead)submitLead(f);else if(f.id==='loginform')login(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#menu');if(m&&!m.hidden)ACT.menu()}});
document.addEventListener('close',e=>{if(e.target.tagName==='DIALOG'&&pending)render(false)},true);

/* ---------- connexion Supabase (stockage des textes, photos, demandes) ---------- */
const sbErr=r=>{if(r.error)throw r.error;return r};
const sbDb={
  collection:col=>({doc:id=>({
    async set(data){const row={col,id,data,updated_at:new Date().toISOString()};sbErr(canAdmin||col==='stats'?await sb.from('docs').upsert(row):await sb.from('docs').insert(row))},
    async delete(){sbErr(await sb.from('docs').delete().eq('col',col).eq('id',id))}})}),
  doc(path){const p=path.split('/');return sbDb.collection(p[0]).doc(p[1])}
};
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm'};
const sbAssets={
  async upload(blob,o={}){const type=o.type||blob.type||'application/octet-stream',path=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.'+(EXT[type]||'bin');
    sbErr(await sb.storage.from('media').upload(path,blob,{contentType:type,cacheControl:'31536000'}));
    return{id:path,url:sb.storage.from('media').getPublicUrl(path).data.publicUrl}},
  async delete(id){await sb.storage.from('media').remove([id])}
};
async function hostImg(dataUrl){const blob=await(await fetch(dataUrl)).blob();return assets.upload(blob)}
function applyRows(rows){COLS.forEach(c=>over[c]={});contentOver={};
  rows.forEach(x=>{if(x.col==='site'){if(x.id==='content')contentOver=x.data||{}}else if(over[x.col])over[x.col][x.id]={...x.data,id:x.id}})}
async function loadAll(){let r;try{r=await sb.from('docs').select('col,id,data')}catch(e){return false}if(r.error)return false;
  applyRows(r.data||[]);
  try{localStorage.setItem('p45-cache',JSON.stringify((r.data||[]).filter(x=>x.col!=='leads')))}catch(e){try{localStorage.removeItem('p45-cache')}catch(x){}}
  return true}
async function setSession(session){userEmail=session&&session.user?session.user.email||'':'';canAdmin=false;
  if(session){try{const r=await sb.rpc('is_admin');canAdmin=r.data===true}catch(e){}}
  isEditor=canAdmin}
function vLogin(){return{title:'Connexion',html:`<section class="wrap sec"><div class="login"><h1>Back-office</h1><p class="muted">Connectez-vous pour modifier le site et suivre les demandes.</p>
  <form class="form" id="loginform" novalidate><div class="f"><label for="lg-e">E-mail</label><input id="lg-e" type="email" autocomplete="username" required></div><div class="f"><label for="lg-p">Mot de passe</label><input id="lg-p" type="password" autocomplete="current-password" required></div><p class="err" id="lg-err" role="alert" hidden></p><button class="btn">Se connecter</button></form>
  <p class="small muted">Mot de passe oublié ? Il se change dans Supabase, rubrique Authentication, Users.</p></div></section>`}}
function loginMsg(e){const m=(e&&e.message)||'',c=(e&&e.code)||'',st=e&&typeof e.status==='number'?e.status:-1,tech=' (Détail : '+(m||c||'erreur '+st)+')';
  if(c==='invalid_credentials'||/invalid login/i.test(m))return 'Supabase ne reconnaît pas cet e-mail ou ce mot de passe. Vérifiez que le compte existe dans Authentication > Users de CE projet, ou redéfinissez son mot de passe.';
  if(/fetch|network|load failed/i.test(m)||st===0)return 'Le site n’arrive pas à joindre Supabase. Vérifiez l’adresse « url » dans config.js et que le projet n’est pas en pause.'+tech;
  if(/api key|apikey|jwt|no api key/i.test(m)||st===401)return 'La clé de config.js est refusée par Supabase. Recopiez la clé « anon » (ou « publishable ») du projet, sans espace ni guillemet en trop.'+tech;
  if(c==='email_not_confirmed'||/not confirmed/i.test(m))return 'Ce compte existe mais son e-mail n’est pas confirmé. Dans Supabase, Authentication > Users, ouvrez le compte et confirmez-le.'+tech;
  if(st===429||/rate limit/i.test(m))return 'Trop d’essais. Patientez quelques minutes avant de réessayer.';
  return 'Connexion refusée par Supabase.'+tech}
async function login(f){const b=$('button',f),e=$('#lg-err');b.disabled=true;b.textContent='Connexion…';let msg='';
  try{const r=await sb.auth.signInWithPassword({email:$('#lg-e').value.trim(),password:$('#lg-p').value});
    if(r.error)msg=loginMsg(r.error);
    else{await setSession(r.data.session);if(!canAdmin){msg='Ce compte n’a pas accès au back-office.';await sb.auth.signOut();await setSession(null)}}}
  catch(x){msg='Connexion impossible. Vérifiez votre accès à internet.'}
  if(msg){e.textContent=msg;e.hidden=false;b.disabled=false;b.textContent='Se connecter';return}
  await loadAll();render(true)}

/* ---------- démarrage ---------- */
(async function init(){
  const cf=window.P45||{},ready=!!(cf.url&&cf.key&&window.supabase&&window.supabase.createClient);
  if(ready){try{sb=window.supabase.createClient(cf.url,cf.key)}catch(e){sb=null}}
  if(sb){canAdmin=false;db=sbDb;assets=sbAssets;try{const c=JSON.parse(localStorage.getItem('p45-cache')||'null');if(Array.isArray(c))applyRows(c)}catch(e){}}
  render(false);
  if(!sb)return;
  try{const r=await sb.auth.getSession();await setSession(r.data?r.data.session:null)}catch(e){}
  await loadAll();soft();
})();
</script>
